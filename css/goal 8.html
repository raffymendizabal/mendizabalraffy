
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS Box Model</title>

    <style>
        body {
            margin: 0;
            background-color: white;
            font-family: cursive;
        }

        .container {
            position: relative;
            width: 100%;
            height: 100vh;
            min-height: 950px;
        }

        /* Main blue box */
        .box {
            position: absolute;
            top: 340px;
            left: 23%;
            width: 55%;
            height: 487px;
            background-color: blue;
        }

        /* Red circle */
        .circle {
            position: absolute;
            top: 583px;
            left: 40%;
            width: 325px;
            height: 325px;
            background-color: red;
            border-radius: 50%;
        }

        /* Purple labels */
        .label {
            position: absolute;
            color: #a879f5;
            font-size: 60px;
            font-weight: bold;
        }

        .top-label {
            top: 130px;
            left: 36%;
        }

        .left-label {
            top: 530px;
            left: 3%;
        }

        .right-label {
            top: 470px;
            left: 80%;
        }

        .bottom-label {
            top: 900px;
            left: 40%;
        }

        /* Arrows */
        .arrow {
            position: absolute;
            font-family: Arial, sans-serif;
            font-size: 55px;
            font-weight: bold;
            color: #a879f5;
        }

        .arrow-top {
            top: 0;
            left: 32%;
            font-size: 100px;
        }

        .arrow-left {
            top: 630px;
            left: 0;
        }

        .arrow-right {
            top: 330px;
            left: 76%;
        }

        .arrow-bottom {
            top: 810px;
            left: 76%;
        }

        /* Red arrows */
        .red-arrow {
            position: absolute;
            color: tomato;
            font-size: 75px;
            font-weight: bold;
        }

        .red-top {
            top: 340px;
            left: 59%;
        }

        .red-bottom {
            top: 530px;
            left: 59%;
        }

        .red-left {
            top: 700px;
            left: 22%;
        }

        .red-right {
            top: 700px;
            left: 49%;
        }

        .red-label {
            position: absolute;
            color: tomato;
            font-size: 60px;
            font-weight: bold;
        }

        .red-label-top {
            top: 390px;
            left: 62%;
        }

        .red-label-left {
            top: 600px;
            left: 30%;
        }

    </style>
</head>

<body>

    <div class="container">

        <div class="box"></div>
        <div class="circle"></div>

        <!-- Purple labels -->
        <div class="label top-label">20px</div>
        <div class="label left-label">100px</div>
        <div class="label right-label">50px</div>
        <div class="label bottom-label">300px</div>

        <!-- Purple arrows -->
        <div class="arrow arrow-top">↕</div>
        <div class="arrow arrow-left">↔</div>
        <div class="arrow arrow-right">↔</div>
        <div class="arrow arrow-bottom">↕</div>

        <!-- Red arrows -->
        <div class="red-arrow red-top">↑</div>
        <div class="red-arrow red-bottom">↓</div>
        <div class="red-arrow red-left">→</div>
        <div class="red-arrow red-right">←</div>

        <!-- Red labels -->
        <div class="red-label red-label-top">150px</div>
        <div class="red-label red-label-left">200px</div>

    </div>

</body>
</html>
