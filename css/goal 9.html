
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS Display Property</title>

    <style>
        body {
            margin: 0;
            padding: 10px 14px;
            background-color: white;
            font-family: Georgia, serif;
        }

        h1 {
            font-size: 70px;
            font-weight: bold;
            margin-top: 45px;
            margin-bottom: 85px;
            color: black;
        }

        .container {
            display: flex;
            gap: 10px;
            align-items: flex-start;
        }

        .box {
            width: 460px;
            height: 460px;
            color: white;
            font-size: 36px;
            flex-shrink: 0;
        }

        .red {
            background-color: red;
        }

        .green {
            background-color: green;
        }

        .blue {
            background-color: blue;
        }

    </style>
</head>

<body>

    <h1>CSS Display Property</h1>

    <div class="container">

        <div class="box red">
            Red Paragraph
        </div>

        <div class="box green">
            Green Paragraph
        </div>

        <div class="box blue">
            Blue Paragraph
        </div>

    </div>

</body>
</html>
