
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS Display Property</title>

    <style>
        body {
            margin: 0;
            padding: 15px 17px;
            background-color: white;
            font-family: Georgia, serif;
        }

        h1 {
            font-size: 80px;
            font-weight: bold;
            margin-top: 35px;
            margin-bottom: 60px;
            color: black;
        }

        .box {
            width: 543px;
            height: 543px;
            color: white;
            font-size: 40px;
            margin-bottom: 44px;
        }

        .red {
            background-color: red;
        }

        .green {
            background-color: green;
        }

        .blue {
            background-color: blue;
        }

        p {
            margin: 0;
        }
    </style>
</head>

<body>

    <h1>CSS Display Property</h1>

    <div class="box red">
        <p>Red Paragraph</p>
    </div>

    <div class="box green">
        <p>Green Paragraph</p>
    </div>

    <div class="box blue">
        <p>Blue Paragraph</p>
    </div>

</body>
</html>
