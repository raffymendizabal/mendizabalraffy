
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Important CSS Properties</title>

    <style>
        body {
            margin: 0;
            padding: 10px;
            min-height: 100vh;
            background: linear-gradient(
                to bottom,
                #5b8fe8,
                #6595ed
            );
            color: white;
            font-family: Georgia, serif;
        }

        h1 {
            font-size: 80px;
            margin-top: 35px;
            margin-bottom: 55px;
        }

        .color {
            color: coral;
            font-size: 40px;
            margin-bottom: 150px;
        }

        .font-size {
            font-size: 130px;
            margin-top: 0;
            margin-bottom: 150px;
        }

        .font-weight {
            font-size: 40px;
            font-weight: bold;
            margin-bottom: 45px;
        }

        .font-family {
            font-size: 40px;
            font-family: cursive;
        }

        .text-align {
            text-align: right;
            font-size: 40px;
            margin-top: 40px;
        }
    </style>
</head>

<body>

    <h1>Important CSS Properties</h1>

    <p class="color">Color</p>

    <p class="font-size">Font Size</p>

    <p class="font-weight">Font Weight</p>

    <p class="font-family">Font Family</p>

    <p class="text-align">Text Align</p>

</body>
</html>
