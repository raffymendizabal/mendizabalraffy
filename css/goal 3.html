<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hello World</title>

    <style>
        body {
            background-color: #f9ecd7;
            margin: 0;
            padding: 49px 10px;
            font-family: "Times New Roman", serif;
        }

        .hello {
            background-color: #91bd91;
            color: white;
            height: 100px;
            font-size: 85px;
            font-weight: bold;
            line-height: 100px;
            padding-left: 0;
            margin-bottom: 56px;
        }

        .world {
            background-color: #c58a3c;
            color: white;
            height: 75px;
            font-size: 65px;
            font-weight: bold;
            line-height: 75px;
            padding-left: 0;
        }
    </style>
</head>

<body>

    <div class="hello">Hello</div>

    <div class="world">World</div>

</body>
</html>
